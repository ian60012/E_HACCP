version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: haccp_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haccp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haccp_password}
      POSTGRES_DB: ${POSTGRES_DB:-haccp_db}
    command: -p 5555
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haccp_user} -d ${POSTGRES_DB:-haccp_db} -p 5555"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haccp_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haccp_user}:${POSTGRES_PASSWORD:-haccp_password}@postgres:5555/${POSTGRES_DB:-haccp_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5555
      POSTGRES_USER: ${POSTGRES_USER:-haccp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haccp_password}
      POSTGRES_DB: ${POSTGRES_DB:-haccp_db}
      PRODUCTION_HELPER_DATA_DIR: /app/app/data/production_helper
      QUALITY_PHOTO_DIR: /app/app/data/quality_photos
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - production_helper_data:/app/app/data/production_helper
      - quality_photo_data:/app/app/data/quality_photos
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: haccp_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

  adminer:
    image: adminer:latest
    container_name: haccp_adminer
    ports:
      - "9090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped

  # Opt-in read-only MCP. It is not started by plain `docker compose up`.
  # Publish only to loopback or the NAS Tailscale IP. Never set MCP_PUBLISH_HOST=0.0.0.0.
  mcp:
    profiles: ["mcp"]
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: haccp_mcp
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      MCP_BIND_HOST: 0.0.0.0
      MCP_PORT: "8765"
      MCP_IN_DOCKER: "1"
      MCP_PUBLISH_HOST: ${MCP_PUBLISH_HOST:-127.0.0.1}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://127.0.0.1:8765}
      HACCP_API_BASE_URL: http://backend:8000
      HACCP_SERVICE_USERNAME: ${HACCP_SERVICE_USERNAME:-}
      HACCP_SERVICE_PASSWORD: ${HACCP_SERVICE_PASSWORD:-}
      HACCP_READONLY_DATABASE_URL: ${HACCP_READONLY_DATABASE_URL:-}
      MCP_AUDIT_LOG_PATH: /var/log/ehaccp-mcp/audit.jsonl
    ports:
      - "${MCP_PUBLISH_HOST:-127.0.0.1}:${MCP_PUBLISH_PORT:-8765}:8765"
    volumes:
      - mcp_audit:/var/log/ehaccp-mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  production_helper_data:
  quality_photo_data:
  mcp_audit:
