version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: haccp_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haccp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haccp_password}
      POSTGRES_DB: ${POSTGRES_DB:-haccp_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5556:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haccp_user} -d ${POSTGRES_DB:-haccp_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haccp_prod_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-haccp_user}:${POSTGRES_PASSWORD:-haccp_password}@postgres:5432/${POSTGRES_DB:-haccp_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-haccp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haccp_password}
      POSTGRES_DB: ${POSTGRES_DB:-haccp_db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      ENVIRONMENT: production
      PRODUCTION_HELPER_DATA_DIR: /app/app/data/production_helper
      QUALITY_PHOTO_DIR: /app/app/data/quality_photos
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
    ports:
      - "8001:8000"
    volumes:
      - production_helper_data_prod:/app/app/data/production_helper
      - quality_photo_data_prod:/app/app/data/quality_photos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: haccp_prod_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

  # Opt-in read-only MCP for the NAS. Not started unless the mcp profile is selected.
  # Set MCP_PUBLISH_HOST to the Tailscale IP. 0.0.0.0 is rejected at startup.
  mcp:
    profiles: ["mcp"]
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: haccp_prod_mcp
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      MCP_BIND_HOST: 0.0.0.0
      MCP_PORT: "8765"
      MCP_IN_DOCKER: "1"
      MCP_PUBLISH_HOST: ${MCP_PUBLISH_HOST:-127.0.0.1}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://127.0.0.1:8765}
      HACCP_API_BASE_URL: http://backend:8000
      HACCP_SERVICE_USERNAME: ${HACCP_SERVICE_USERNAME:-}
      HACCP_SERVICE_PASSWORD: ${HACCP_SERVICE_PASSWORD:-}
      HACCP_READONLY_DATABASE_URL: ${HACCP_READONLY_DATABASE_URL:-}
      MCP_AUDIT_LOG_PATH: /var/log/ehaccp-mcp/audit.jsonl
    ports:
      - "${MCP_PUBLISH_HOST:-127.0.0.1}:${MCP_PUBLISH_PORT:-8765}:8765"
    volumes:
      - mcp_audit_prod:/var/log/ehaccp-mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata_prod:
  production_helper_data_prod:
  quality_photo_data_prod:
  mcp_audit_prod:
